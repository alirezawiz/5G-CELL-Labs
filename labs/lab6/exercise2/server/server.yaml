apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-server
spec:
  replicas: 1  # Start with one replica
  selector:
    matchLabels:
      app: flask-server
  template:
    metadata:
      labels:
        app: flask-server
    spec:
      containers:
      - name: flask-server
        image: flask-server:latest
        ports:
        - containerPort: 5000
        imagePullPolicy: Never

---
apiVersion: v1
kind: Service
metadata:
  name: flask-server
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: flask-server
